name: App Android (APK)

# Empaqueta el juego como app de Android con Capacitor.
# - En cada push a main: compila el APK y lo publica en Releases
#   (siempre con el mismo nombre, HierroYDivisa.apk, para que el enlace
#   .../releases/latest/download/HierroYDivisa.apk no cambie nunca).
# - En los pull requests: solo compila, para comprobar que no se rompe.
#
# Firma: si existen los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
# y ANDROID_KEY_ALIAS (y opcionalmente ANDROID_KEY_PASSWORD), el APK se firma con
# esa clave y cada versión nueva se instala encima de la anterior sin perder la
# partida. Sin ellos se firma con una clave de depuración temporal.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: juego

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar proyecto Capacitor
        run: |
          mkdir app && cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          rsync -a --exclude .git --exclude .github --exclude '*.md' --exclude tests --exclude docs --exclude modelos/persona.gltf.json --exclude modelos/persona2.gltf.json --exclude modelos/caballo.gltf.json ../juego/ www/
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "io.github.jalagardalengua.hierroydivisa",
            "appName": "Hierro y Divisa",
            "webDir": "www",
            "android": { "backgroundColor": "#06070a" }
          }
          JSON
          npx cap add android

      - name: Icono y versión
        working-directory: app/android
        run: |
          command -v convert > /dev/null || sudo apt-get install -y imagemagick
          RES=app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert ../www/img/icono-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
          done
          sed -i "s/versionCode 1$/versionCode $VERSION_CODE/; s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Compilar APK
        working-directory: app/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # quita espacios, saltos de línea y caracteres invisibles que se cuelan al pegar desde el móvil
          limpia() { printf '%s' "$1" | LC_ALL=C tr -cd '[:graph:]'; }
          KS=$(limpia "$KS"); export KS_PASS=$(limpia "$KS_PASS"); KEY_ALIAS=$(limpia "$KEY_ALIAS"); KEY_PASS=$(limpia "$KEY_PASS")
          if [ -n "$KS" ]; then
            export KEY_PASS="${KEY_PASS:-$KS_PASS}"
            echo "Clave: ${#KS} caracteres; contraseña: ${#KS_PASS} caracteres; alias: $KEY_ALIAS"
            ./gradlew --no-daemon assembleRelease
            echo "$KS" | base64 -d > firma.jks
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk alineado.apk
            "$BT/apksigner" sign --ks firma.jks --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
              --out "$GITHUB_WORKSPACE/HierroYDivisa.apk" alineado.apk
            rm -f firma.jks
          else
            echo "::warning::No hay clave de firma (secretos ANDROID_*). El APK usa una clave de depuración: para actualizar habrá que desinstalar la versión anterior."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HierroYDivisa.apk"
          fi
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/HierroYDivisa.apk" | head -3
          ls -lh "$GITHUB_WORKSPACE/HierroYDivisa.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HierroYDivisa-apk
          path: HierroYDivisa.apk

      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<EOF
          App de Android de **Hierro y Divisa**, versión $VERSION_NAME.

          **Cómo instalarla**
          1. Descarga \`HierroYDivisa.apk\` desde el móvil.
          2. Ábrelo. Si Android lo pide, permite que el navegador instale apps.
          3. Pulsa «Instalar».

          Las versiones nuevas se instalan encima de la anterior.
          EOF
          gh release create "v$VERSION_NAME" HierroYDivisa.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Hierro y Divisa $VERSION_NAME" --notes-file notas.md --latest
          # deja solo las 5 versiones más recientes de la app
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | grep '^v1\.0\.' | tail -n +6 \
            | xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
