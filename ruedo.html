<style>
/* Layout: escena a pantalla completa; cartel taurino arriba a la izquierda, panel de mando abajo. */
:root{
  --ink:#0d0b0a; --panel:rgba(16,12,10,.78); --bone:#efe6d6; --muted:#b8a991;
  --oro:#d4ae5c; --grana:#a01d25; --albero:#c98b4b; --line:rgba(212,174,92,.30);
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--serif:'Cinzel',Georgia,serif;
  --ui:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;font-family:var(--ui)}
#stage{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;filter:contrast(1.04) saturate(1.06)}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

.bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s ease;pointer-events:none}
.bar.t{top:0}.bar.b{bottom:0}
body.cine .bar{height:0}
.cartel{position:absolute;padding:10px 14px 12px;margin:-10px -14px;background:radial-gradient(120% 120% at 0 0,rgba(0,0,0,.55),rgba(0,0,0,0) 75%);top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));max-width:min(440px,calc(100% - 32px));pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.eyebrow{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro)}
.cartel h1{margin:2px 0 0;font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(26px,4.2vw,44px);line-height:1.02;text-wrap:balance}
.cartel h1 em{font-style:italic;font-weight:500;color:var(--oro)}
.suit{margin:4px 0 0;font-size:15px;letter-spacing:.06em;color:var(--bone)}
.toro{margin:6px 0 0;font-size:13px;letter-spacing:.04em;color:var(--muted)}

#loading .ldBar{position:relative;height:3px;max-width:320px;margin:14px auto 0;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}

 #loading .ldVig{background:linear-gradient(90deg,transparent 40%,rgba(0,0,0,.7) 62%,#000)}#loading .ldInfo{left:auto;right:0;top:0;bottom:0;width:min(46%,460px);display:flex;flex-direction:column;justify-content:center;text-align:left}#loading .ldBar{margin-left:0;margin-right:0;width:100%}}

.cartel{background:linear-gradient(90deg,rgba(8,6,5,.78),rgba(8,6,5,.55) 70%,rgba(8,6,5,0));padding:12px 26px 12px 16px !important;margin:0 !important;left:0 !important;top:calc(env(safe-area-inset-top,0px) + 6px) !important;border-radius:0 14px 14px 0}

.panel .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btnR{font:700 13px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:9px 13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--bone);cursor:pointer;border-radius:10px}
.btnR.oro{background:linear-gradient(180deg,#f2d488,#c99634);color:#1a1206;border:0}
.chip{border-radius:999px}

.resC p{margin:6px 0 0;font-size:15px;letter-spacing:.03em;color:var(--bone)}
.resC .muted{color:var(--muted);font-size:13px}
.panu{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;min-height:40px}
.panu i{width:34px;height:28px;border-radius:3px;display:block;transform-origin:50% 0;animation:pan .7s ease-in-out infinite alternate;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.panu i:nth-child(2){animation-delay:.2s}.panu i:nth-child(3){animation-delay:.35s}

.trof{display:flex;justify-content:center;gap:8px;margin-top:10px;font-size:26px}

.cartel{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 50%),rgba(14,15,20,.78)!important;border:1px solid rgba(255,255,255,.07);border-left:3px solid var(--oro)!important;border-radius:0 16px 16px 0!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 40px -22px rgba(0,0,0,.9);text-shadow:none!important;padding:10px 18px 10px 14px!important}

.suerte small{font-size:11px!important;text-transform:uppercase;letter-spacing:.12em}
#ole{font-family:var(--display)!important;font-style:italic;font-weight:800!important;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 6px 30px rgba(0,0,0,.65)}

.resC h2{font-family:var(--display)!important;font-style:normal!important;font-weight:800!important;text-transform:uppercase;letter-spacing:.03em}
.btnR.oro{border-radius:12px}
.vig{background:radial-gradient(130% 100% at 50% 45%,transparent 62%,rgba(0,0,0,.4) 100%)!important}

#cartel{display:none!important}
/* ---------- barra mínima (como en el corro) ---------- */
.bar2{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px;opacity:.82;transition:opacity .25s;pointer-events:none}
.bar2:hover,.bar2:focus-within{opacity:1}
.b2{pointer-events:auto;min-height:34px;padding:.3rem .8rem;font:700 12px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:#f3ead8;background:rgba(10,9,12,.55);border:1px solid rgba(230,187,85,.35);border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
.b2:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
#hud{display:none!important}
.cartel{max-width:min(340px,calc(100% - 32px))}
.cartel h1{font-size:clamp(22px,3.4vw,34px)!important}
.cartel .suit{font-size:13px}.cartel .toro{font-size:12px}
.suerte{margin-top:8px!important}.suerte b{font-size:18px!important}

@media (max-height:460px){.cartel .toro{display:none}.cartel{padding:8px 20px 8px 12px!important}.b2{min-height:30px;font-size:11px;padding:.25rem .65rem}}
@media (max-width:640px){.row{grid-template-columns:62px minmax(0,1fr)}.hud{display:none}.cartel h1{font-size:26px}.suerte b{font-size:18px}.toro{display:none}}
