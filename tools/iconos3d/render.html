<!doctype html>
<!-- Estudio de iconos 3D: renderiza los iconos de la barra inferior con luz de estudio.
     Lo ejecuta tools/iconos3d/render.js (Playwright). No forma parte del juego. -->
<meta charset="utf-8">
<body style="margin:0;background:transparent">
<script src="../../js/vendor/three.min.js"></script>
<script src="../../js/vendor/GLTFLoader.js"></script>
<script src="RoomEnvironment.js"></script>
<script>
const SZ=512;
const R=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setSize(SZ,SZ);R.setPixelRatio(1);R.setClearColor(0,0);
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.92;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
const pm=new THREE.PMREMGenerator(R);const ENV=pm.fromScene(new THREE.RoomEnvironment(),.04).texture;
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const std=(c,o={})=>new THREE.MeshStandardMaterial({color:C(c),roughness:o.r??.6,metalness:o.m??0,envMapIntensity:o.e??.45});
const loader=new THREE.GLTFLoader();
const glb=n=>new Promise((ok,ko)=>loader.load('../../modelos/'+n+'.glb',ok,undefined,ko));

function escena(){
  const s=new THREE.Scene();s.environment=ENV;
  const key=new THREE.DirectionalLight(C('#fff1d6'),3.4);key.position.set(4,6,5);key.castShadow=true;
  key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.5,far:30});key.shadow.bias=-.0004;key.shadow.radius=6;
  const rim=new THREE.DirectionalLight(C('#ffcf7a'),2.8);rim.position.set(-5,4,-6);
  const fill=new THREE.HemisphereLight(C('#cfd8ff'),C('#3a2a18'),.35);
  s.add(key,rim,fill);
  // sombra de contacto: disco que solo recibe sombra
  const sh=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.ShadowMaterial({opacity:.45}));sh.rotation.x=-Math.PI/2;sh.receiveShadow=true;s.add(sh);
  return s;
}
function encuadrar(obj,cam,dir,margen=1.18){
  const b=new THREE.Box3().setFromObject(obj),c=b.getCenter(new THREE.Vector3()),sp=b.getBoundingSphere(new THREE.Sphere());
  const d=sp.radius*margen/Math.sin(THREE.MathUtils.degToRad(cam.fov/2));
  cam.position.copy(c).add(dir.clone().normalize().multiplyScalar(d));cam.lookAt(c);cam.near=d/20;cam.far=d*10;cam.updateProjectionMatrix();
}
function sombras(o){o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}})}
function normalizar(o,alto){const b=new THREE.Box3().setFromObject(o);const h=b.max.y-b.min.y;o.scale.multiplyScalar(alto/h);
  const b2=new THREE.Box3().setFromObject(o);o.position.y-=b2.min.y;const c=b2.getCenter(new THREE.Vector3());o.position.x-=c.x;o.position.z-=c.z;return o}
function render(s,cam){R.render(s,cam);return R.domElement.toDataURL('image/png')}

const ICONOS={
  async inicio(){ // cortijo andaluz: cal blanca, teja árabe, zócalo de albero, arco
    const s=escena(),g=new THREE.Group();
    const cal=std('#f4efe6',{r:.85}),teja=std('#a8401f',{r:.65}),albero=std('#d9a85b',{r:.8}),madera=std('#4a2a18',{r:.6}),hierro=std('#1a1714',{r:.4,m:.6});
    const casa=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.3,1.6),cal);casa.position.y=.65;g.add(casa);
    const zoc=new THREE.Mesh(new THREE.BoxGeometry(2.64,.22,1.64),albero);zoc.position.y=.11;g.add(zoc);
    const torre=new THREE.Mesh(new THREE.BoxGeometry(.9,2.1,.9),cal);torre.position.set(-.85,1.05,.1);g.add(torre);
    const tz=new THREE.Mesh(new THREE.BoxGeometry(.94,.22,.94),albero);tz.position.set(-.85,.11,.1);g.add(tz);
    const tejado=(w,d,h)=>{const sh=new THREE.Shape();sh.moveTo(-w/2,0);sh.lineTo(0,h);sh.lineTo(w/2,0);sh.closePath();
      const geo=new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false});geo.translate(0,0,-d/2);return new THREE.Mesh(geo,teja)};
    const t1=tejado(1.84,2.8,.55);t1.rotation.y=Math.PI/2;t1.position.set(0,1.3,0);g.add(t1);
    const t2=new THREE.Mesh(new THREE.ConeGeometry(.74,.55,4),teja);t2.rotation.y=Math.PI/4;t2.position.set(-.85,2.37,.1);g.add(t2);
    const arco=new THREE.Shape();arco.moveTo(-.28,0);arco.lineTo(-.28,.5);arco.absarc(0,.5,.28,Math.PI,0,true);arco.lineTo(.28,0);arco.closePath();
    const puerta=new THREE.Mesh(new THREE.ExtrudeGeometry(arco,{depth:.06,bevelEnabled:false}),madera);puerta.position.set(.35,.0,.79);g.add(puerta);
    for(const x of [-.25,.95]){const v=new THREE.Mesh(new THREE.BoxGeometry(.26,.34,.05),hierro);v.position.set(x,.85,.81);g.add(v)}
    const vt=new THREE.Mesh(new THREE.BoxGeometry(.22,.36,.05),hierro);vt.position.set(-.85,1.6,.56);g.add(vt);
    sombras(g);s.add(g);const cam=new THREE.PerspectiveCamera(30,1,.1,100);encuadrar(g,cam,new THREE.Vector3(1.1,.75,1.6),.98);return render(s,cam);
  },
  async finca(){ // dehesa: loma, encina y cerca
    const s=escena(),g=new THREE.Group();
    const loma=new THREE.Mesh(new THREE.SphereGeometry(2,48,24,0,Math.PI*2,0,Math.PI/2),std('#5f7d2a',{r:.95}));loma.scale.set(1,.22,.8);g.add(loma);
    const enc=(await glb('encina')).scene;enc.traverse(m=>{if(m.isMesh){const n=(m.material.name||'').toLowerCase();
      m.material=std(/trunk|wood|brown|dark/.test(n)?'#4a3424':'#2f4f1c',{r:.85})}});
    normalizar(enc,2.9);enc.scale.x*=1.35;enc.scale.z*=1.35;enc.position.set(-.35,.3,-.1);g.add(enc);
    const mad=std('#6b4a2e',{r:.8});
    for(let i=0;i<4;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.09,.6,.09),mad);p.position.set(.5+i*.45,.48,.7-i*.12);g.add(p)}
    for(const y of [.42,.66]){const r=new THREE.Mesh(new THREE.BoxGeometry(1.45,.06,.05),mad);r.position.set(1.18,y,.52);r.rotation.y=.26;g.add(r)}
    sombras(g);s.add(g);const cam=new THREE.PerspectiveCamera(30,1,.1,100);encuadrar(g,cam,new THREE.Vector3(.8,.6,1.6),.92);return render(s,cam);
  },
  async camada(){ // toro bravo negro, tres cuartos, cuernos color hueso
    const s=escena();const gl=await glb('toro');const t=gl.scene;
    t.traverse(m=>{if(!m.isMesh)return;const n=m.material.name;
      m.material=std(n==='Horns'?'#e8dcc0':n==='Main_Light'?'#1a1512':n==='Muzzle'?'#2b2422':n==='Hooves'?'#141110':n==='Eye_White'?'#d8d0c0':n==='Eye_Black'?'#050404':'#16120f',{r:n==='Horns'?.35:.55,e:1.2})});
    const mx=new THREE.AnimationMixer(t);const cl=gl.animations.find(a=>a.name==='Idle_Headlow')||gl.animations[0];mx.clipAction(cl).play();mx.update(.6);
    normalizar(t,2);t.rotation.y=.95;sombras(t);s.add(t);
    const cam=new THREE.PerspectiveCamera(28,1,.1,100);encuadrar(t,cam,new THREE.Vector3(.9,.35,1.4),.78);return render(s,cam);
  },
  async ofertas(){ // plaza de toros en miniatura: tendidos, barrera roja, ruedo de albero
    const s=escena(),g=new THREE.Group();
    const perfil=[[1.05,0],[1.6,0],[1.6,.9],[1.52,.9],[1.15,.32],[1.05,.32]].map(p=>new THREE.Vector2(p[0],p[1]));
    const tend=new THREE.Mesh(new THREE.LatheGeometry(perfil,64),std('#f1ebe0',{r:.8}));g.add(tend);
    for(let k=1;k<5;k++){const rr=1.15+k*.085,yy=.32+k*.14;const fila=new THREE.Mesh(new THREE.TorusGeometry(rr,.012,6,96),std('#9a8a74'));fila.rotation.x=Math.PI/2;fila.position.y=yy;g.add(fila)}
    const ocre=new THREE.Mesh(new THREE.CylinderGeometry(1.61,1.61,.18,64,1,true),std('#c98a3c',{r:.7}));ocre.position.y=.81;g.add(ocre);
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(1.06,1.06,.3,64,1,true),std('#a3121f',{r:.55}));bar.material.side=THREE.DoubleSide;bar.position.y=.15;g.add(bar);
    const ruedo=new THREE.Mesh(new THREE.CircleGeometry(1.05,64),std('#d98f3a',{r:.95}));ruedo.rotation.x=-Math.PI/2;ruedo.position.y=.01;g.add(ruedo);
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2;const arc=new THREE.Mesh(new THREE.BoxGeometry(.1,.22,.04),std('#7a4a22'));
      arc.position.set(Math.cos(a)*1.61,.55,Math.sin(a)*1.61);arc.lookAt(0,.55,0);g.add(arc)}
    sombras(g);s.add(g);const cam=new THREE.PerspectiveCamera(30,1,.1,100);encuadrar(g,cam,new THREE.Vector3(.2,1.0,1.6),.9);return render(s,cam);
  },
  async mercado(){ // monedas de oro apiladas y un billete
    const s=escena(),g=new THREE.Group();const oro=std('#e6bb55',{r:.28,m:1,e:1.6}),canto=std('#c99a3a',{r:.35,m:1,e:1.4});
    const moneda=()=>new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.1,48),[canto,oro,oro]);
    const pilas=[[0,0,8],[.95,.25,5],[-.85,.35,3]];
    pilas.forEach(([x,z,n])=>{for(let i=0;i<n;i++){const m=moneda();m.position.set(x+(Math.random()-.5)*.04,.05+i*.105,z+(Math.random()-.5)*.04);g.add(m)}});
    const suelta=moneda();suelta.position.set(.35,.45,1.05);suelta.rotation.set(1.15,0,.35);g.add(suelta);
    sombras(g);s.add(g);const cam=new THREE.PerspectiveCamera(30,1,.1,100);encuadrar(g,cam,new THREE.Vector3(.5,.75,1.6),.9);return render(s,cam);
  },
  async tareas(){ // portapapeles de madera con hoja y marca de hecho
    const s=escena(),g=new THREE.Group();
    const tabla=new THREE.Mesh(new THREE.BoxGeometry(1.5,2,.08),std('#8a5a32',{r:.65}));g.add(tabla);
    const hoja=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.65,.02),std('#f4efe6',{r:.9}));hoja.position.set(0,-.08,.05);g.add(hoja);
    const pinza=new THREE.Mesh(new THREE.BoxGeometry(.7,.28,.14),std('#c9ccd2',{r:.25,m:1,e:1.4}));pinza.position.set(0,.92,.08);g.add(pinza);
    const raya=(y,w,c)=>{const r=new THREE.Mesh(new THREE.BoxGeometry(w,.07,.01),std(c,{r:.8}));r.position.set(-.04+(w-.8)/2*0+.18,y,.07);g.add(r)};
    [[.35,.75],[.05,.75],[-.25,.75],[-.55,.5]].forEach(([y,w])=>{const r=new THREE.Mesh(new THREE.BoxGeometry(w,.07,.01),std('#6d6a64',{r:.8}));r.position.set(.15+(w-.75)/2,y,.07);g.add(r)});
    const ck=new THREE.CatmullRomCurve3([new THREE.Vector3(-.58,.36,.09),new THREE.Vector3(-.47,.25,.09),new THREE.Vector3(-.28,.5,.09)],false,'catmullrom',0);
    const tick=new THREE.Mesh(new THREE.TubeGeometry(ck,16,.045,8),std('#c41f2f',{r:.5}));g.add(tick);
    for(const y of [.05,-.25,-.55]){const b=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.01),std('#9a958c',{r:.8}));b.position.set(-.43,y,.07);g.add(b)}
    g.rotation.set(-.35,.35,.08);g.position.y=1.15;sombras(g);s.add(g);
    const cam=new THREE.PerspectiveCamera(30,1,.1,100);encuadrar(g,cam,new THREE.Vector3(.2,.35,1.6),.92);return render(s,cam);
  },
  async copa(){ // copa de trofeo de oro
    const s=escena(),g=new THREE.Group();const oro=std('#f0c24a',{r:.22,m:1,e:2.2}),base=std('#2a1430',{r:.4,m:.3,e:1});
    const prof=[[0,0],[.95,0],[.95,.28],[.7,.34],[.6,.5],[.28,.62],[.2,1.15],[.32,1.25],[.55,1.32],[.95,1.6],[1.15,2.1],[1.2,2.6],[1.12,2.62],[1.02,2.15],[.0,1.6]].map(p=>new THREE.Vector2(p[0],p[1]));
    const cuerpo=new THREE.Mesh(new THREE.LatheGeometry(prof.slice(2),64),oro);g.add(cuerpo);
    const pie=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.1,.3,64),base);pie.position.y=.15;g.add(pie);
    for(const sx of [-1,1]){const asa=new THREE.Mesh(new THREE.TorusGeometry(.42,.08,16,48,Math.PI*1.1),oro);asa.position.set(sx*1.12,2.05,0);asa.rotation.z=sx>0?-Math.PI*.55:Math.PI*.45;g.add(asa)}
    sombras(g);s.add(g);const cam=new THREE.PerspectiveCamera(30,1,.1,100);encuadrar(g,cam,new THREE.Vector3(.3,.35,1.6),.95);return render(s,cam);
  },
  async silueta(){ // silueta negra del toro de perfil para el cartel
    const s=new THREE.Scene();const gl=await glb('toro');const t=gl.scene;t.traverse(m=>{if(m.isMesh)m.material=new THREE.MeshBasicMaterial({color:0x000000,skinning:true})});
    const mx=new THREE.AnimationMixer(t);mx.clipAction(gl.animations.find(a=>a.name==='Idle')).play();mx.update(.4);normalizar(t,2);t.rotation.y=Math.PI/2;s.add(t);
    const cam=new THREE.PerspectiveCamera(20,1,.1,100);encuadrar(t,cam,new THREE.Vector3(0,.05,1),.9);return render(s,cam);
  },
  async palmares(){ // sombrero campero: fieltro negro, ala ancha plana, copa baja y cinta
    const s=escena(),g=new THREE.Group();const fieltro=std('#1b1714',{r:.82,e:.6}),cinta=std('#7a4a22',{r:.5});
    const ala=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.28,.06,72),fieltro);ala.position.y=.03;g.add(ala);
    const borde=new THREE.Mesh(new THREE.TorusGeometry(1.265,.035,10,96),fieltro);borde.rotation.x=Math.PI/2;borde.position.y=.03;g.add(borde);
    const copa=new THREE.Mesh(new THREE.CylinderGeometry(.6,.66,.62,64),fieltro);copa.position.y=.37;g.add(copa);
    const tapa=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.02,64),fieltro);tapa.position.y=.69;g.add(tapa);
    const cin=new THREE.Mesh(new THREE.CylinderGeometry(.665,.67,.14,64,1,true),cinta);cin.position.y=.13;g.add(cin);
    const hebilla=new THREE.Mesh(new THREE.BoxGeometry(.16,.12,.03),std('#e6bb55',{r:.3,m:1,e:1.4}));hebilla.position.set(.3,.13,.6);hebilla.lookAt(.6,.13,1.3);g.add(hebilla);
    g.rotation.set(.18,-.4,-.06);g.position.y=.35;sombras(g);s.add(g);
    const cam=new THREE.PerspectiveCamera(30,1,.1,100);encuadrar(g,cam,new THREE.Vector3(.4,.55,1.6),.9);return render(s,cam);
  }
};
window.renderIcono=async n=>ICONOS[n]();
window.LISTO=true;
</script>
